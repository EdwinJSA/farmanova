version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: my_postgres_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: farmanova_app
    restart: always
    ports:
      - "4000:4000" # Ajusta el puerto si tu app usa otro
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres?schema=public
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge